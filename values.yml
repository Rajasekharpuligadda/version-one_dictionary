replicaCount: 1
image:
  repository: localhost:32000/dictionary
  tag: 0.0.1
  pullPolicy: IfNotPresent
env:
- SERVICE_VERSION: v1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
service:
  enabled: true
  type: ClusterIP
  port: 8080
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilization: 50Mi
pdb:
  enabled: true
  minAvailable: 1
probes:
  livenessProbe:
    enabled: false
    path: /actuator/health/liveness
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    enabled: false
    path: /actuator/health/readiness
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  startupProbe:
    enabled: false
    path: /startup
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 30
    successThreshold: 1
securityContext:
  enabled: true
  runAsUser: 1000
  fsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
nodeSelector:
  enabled: false
  key: ''
  value: ''
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
  paths:
  - path: /dictionary/api
    pathType: Exact
    port: 8080
pvc:
  enabled: false
  storageClassName: ''
  accessMode: ReadWriteOnce
  storageSize: 1Gi
logs:
  enabled: false
  mountPath: /logs
  volumeType: emptyDir
  pvc:
    claimName: pmaa-service-logs-pvc
model:
  enabled: false
  name: yi-coder
  replicas: 1
  repository: yi-coder
  tag: latest
  imagePullPolicy: IfNotPresent
  storageClassName: azurefile-csi
  persistentVolume:
    accessMode: ReadWriteMany
